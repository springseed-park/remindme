<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RemindMe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
      body {
        font-family: 'Noto Sans KR', sans-serif;
      }
      @keyframes progress-once {
        from { width: 0%; }
        to { width: 100%; }
      }
      .animate-progress {
        animation: progress-once 2.5s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      .animate-fade-out {
        animation: fadeOut 0.3s ease-out forwards;
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.3s ease-out forwards;
      }
      @keyframes slideInRight {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-in-right {
        animation: slideInRight 0.3s ease-out forwards;
      }
       @keyframes slideOutRight {
        from { transform: translateX(0); }
        to { transform: translateX(100%); }
      }
      .animate-slide-out-right {
        animation: slideOutRight 0.3s ease-out forwards;
      }
      @keyframes slideInLeft {
        from { transform: translateX(-100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-in-left {
        animation: slideInLeft 0.3s ease-out forwards;
      }
      @keyframes twitch-left {
        0%, 100% { transform: rotate(-15deg); }
        50% { transform: rotate(-22deg) translateY(-3px); }
      }
      @keyframes twitch-right {
        0%, 100% { transform: rotate(15deg); }
        50% { transform: rotate(22deg) translateY(-3px); }
      }
      .animate-twitch-left {
          animation: twitch-left 2.5s ease-in-out infinite;
      }
      .animate-twitch-right {
          animation: twitch-right 2.5s ease-in-out infinite;
      }
      @keyframes blink {
        0%, 95%, 100% { transform: scaleY(1); }
        97.5% { transform: scaleY(0.1); }
      }
      .animate-blink {
        animation: blink 4s ease-in-out infinite;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",

  }
}
</script>

</head>

  </body>
</html>
